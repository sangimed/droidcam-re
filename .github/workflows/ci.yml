name: Build clients

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Build Android debug and benchmark APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleBenchmark
          mkdir -p dist/android
          cp app/build/outputs/apk/debug/app-debug.apk dist/android/droidcam-clone-android-debug.apk
          cp app/build/outputs/apk/benchmark/app-benchmark.apk dist/android/droidcam-clone-android-benchmark.apk
        working-directory: android

      - name: Upload Android CI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apks
          path: android/dist/android/*.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 build
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Windows x64 build
        run: cmake -S windows -B windows/build -A x64

      - name: Build Windows x64 executable
        run: cmake --build windows/build --config Release --parallel

      - name: Package Windows x64 CI artifact
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'windows/dist/windows'
          $stage = Join-Path $env:RUNNER_TEMP 'droidcam-clone-windows-stage'
          New-Item -ItemType Directory -Force -Path $stage, $dist | Out-Null
          Copy-Item -LiteralPath 'windows/build/Release/droidcam_clone.exe' -Destination $stage
          Copy-Item -LiteralPath 'README.md' -Destination $stage
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $dist 'droidcam-clone-windows-ci-x64.zip') -Force

      - name: Upload Windows CI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-zip
          path: windows/dist/windows/*.zip
          if-no-files-found: error
          retention-days: 14
